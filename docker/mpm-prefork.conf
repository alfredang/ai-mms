# Apache prefork pool. Debian's default (StartServers 5 / MinSpare 5 / MaxSpare 10)
# is far too small: one storefront page view fires ~58 parallel CSS/JS requests
# (merge is off), so prefork had to fork ~50 workers per visit at 1,2,4,8,16,32/s
# — every static file waited ~1.5 s and the homepage banner (painted only after
# DOMContentLoaded) appeared 2-9 s late on SG (2026-11-02). Keep enough idle
# workers to absorb one page's burst. Sized for the smallest partner box (8 GB).
<IfModule mpm_prefork_module>
	StartServers             16
	MinSpareServers          16
	MaxSpareServers          48
	MaxRequestWorkers       150
	MaxConnectionsPerChild    0
</IfModule>
